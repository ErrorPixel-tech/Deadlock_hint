<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Контр-предметы</title>
    <style>
        /* === 1. Базовые переменные === */
        :root {
            --bg: #1a1a1f;
            --bg-elevated: #22222a;
            --bg-card: #2a2a33;
            --border: #3a3a44;
            --border-hover: #55555f;
            --text: #eee;
            --text-muted: #aaa;
            --text-dim: #777;

            --accent: #4ade80;
            --accent-bg: #1e3a2a;
            --accent-glow: rgba(74, 222, 128, 0.4);

            --spirit: #e760ff;
            --gun: #ffa114;

            --danger: #f44336;
            --danger-bg: rgba(244, 67, 54, 0.15);

            --radius: 10px;
            --radius-sm: 6px;
            --gap: 16px;

            --transition: 0.15s ease;
        }

        /* === 2. Сброс и базовая типографика === */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px;
            line-height: 1.3;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 32px 0 12px;
        }

        /* === 3. Обёртка === */
        .page-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* === 4. Шапка === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 24px;
        }

        /* === 5. Кнопки === */
        .btn {
            background: var(--bg-elevated);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            cursor: pointer;
            font: inherit;
            font-weight: 500;
            color: var(--text);
            transition: border-color var(--transition), background var(--transition), transform var(--transition);
        }

        .btn:hover {
            border-color: var(--border-hover);
            background: var(--bg-card);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .btn--reset {
            padding: 8px 14px;
            font-size: 14px;
        }

        /* === 6. Сетка героев === */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 10px;
            cursor: pointer;
            text-align: center;
            transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
            user-select: none;
        }

        .card:hover {
            border-color: var(--border-hover);
        }

        .card:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .card.active {
            border-color: var(--accent);
            background: var(--accent-bg);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .card .name {
            font-weight: 600;
        }

        /* === 7. Счётчики spirit / gun === */
        .hero-counting {
            display: inline-flex;
            gap: 24px;
            background: var(--bg-elevated);
            border-radius: var(--radius);
            padding: 12px 18px;
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .counts__spirit {
            color: var(--spirit);
        }

        .counts__gun {
            color: var(--gun);
        }

        /* === 8. Опасные герои === */
        .dangerous-list {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 6px;
            background: var(--bg);
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            font-size: 14px;
        }

        /* === 9. Чёрный список === */
        .blacklist__items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .blacklist__item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            background: var(--danger-bg);
            font-size: 14px;
        }

        .blacklist__icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        /* === 10. Фильтры-категории === */
        .radio-category {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .check-style {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px 6px 6px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            cursor: pointer;
            user-select: none;
            font-size: 14px;
            font-weight: 500;
            transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
        }

        .check-style--all {
            height: 46.6px;
            padding: 6px;
        }

        .check-style:hover {
            border-color: var(--border-hover);
        }

        .check-style:has(.category-checkbox:checked) {
            border-color: var(--accent);
            background: var(--accent-bg);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .check-style:has(.category-checkbox:focus-visible) {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .category-checkbox {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .category-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* === 11. Результаты === */
        .result {
            background: var(--bg-elevated);
            border-radius: var(--radius);
            padding: 16px 20px;
        }

        .tier-group+.tier-group {
            margin-top: 8px;
        }

        .tier-group__title {
            font-size: 13px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin: 20px 0 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .tier-group:first-child .tier-group__title {
            margin-top: 0;
        }

        .result-row {
            display: grid;
            grid-template-columns: 44px 44px 160px 1fr auto;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
            transition: background var(--transition);
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .result-row.is-highlighted {
            background: rgba(34, 60, 35, 0.6);
            border-radius: var(--radius-sm);
        }

        .result-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .result__icon {
            width: 44px;
            height: 44px;
            object-fit: contain;
        }

        .result__item {
            font-weight: 500;
        }

        .result__count {
            padding: 4px 8px;
            font-size: 17px;
            font-weight: 600;
            text-align: center;
            min-width: 36px;
        }

        .result__heroes {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            background: var(--bg);
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            color: var(--text-muted);
        }

        .result__hide {
            margin-left: auto;
            padding: 4px 10px;
            font-size: 13px;
            color: var(--text-dim);
            cursor: pointer;
            opacity: 0;
            transition: opacity var(--transition), color var(--transition);
            user-select: none;
        }

        .result-row:hover .result__hide {
            opacity: 0.7;
        }

        .result__hide:hover {
            opacity: 1 !important;
            color: var(--danger);
        }

        /* === 12. Цвета счётчиков === */
        .count-1 {
            color: #4caf50;
        }

        .count-2 {
            color: #8bc34a;
        }

        .count-3 {
            color: #ffc107;
        }

        .count-4 {
            color: #ff9800;
        }

        .count-5 {
            color: #ff5722;
        }

        .count-6 {
            color: #f44336;
        }

        /* === 13. Отступы между группами count === */
        .result-row:has(.count-6)+.result-row:not(:has(.count-6)),
        .result-row:has(.count-5)+.result-row:not(:has(.count-5)),
        .result-row:has(.count-4)+.result-row:not(:has(.count-4)),
        .result-row:has(.count-3)+.result-row:not(:has(.count-3)),
        .result-row:has(.count-2)+.result-row:not(:has(.count-2)) {
            margin-top: 14px;
        }

        /* === 14. Адаптив === */
        @media (max-width: 720px) {
            body {
                padding: 16px;
            }

            h1 {
                font-size: 18px;
            }

            .header {
                flex-direction: column;
                align-items: stretch;
            }

            .result-row {
                grid-template-columns: 36px 36px 1fr auto;
                gap: 8px;
            }

            .result__heroes {
                grid-column: 1 / -1;
                /* переносим на новую строку */
            }

            .result__icon {
                width: 36px;
                height: 36px;
            }
        }

        /* === 15. Скроллбар (опционально) === */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }
    </style>
</head>

<body>

            indomitable: ['abrams', 'bebop', 'billy', 'drifter', 'graves', 'grey_talon', 'haze', 'holiday', 'infernus', 'lady_geist', 'lash', 'mo_and_krill', 'paige', 'paradox', 'rem', 'seven', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'vindicta', 'vyper', 'warden', 'wraith'],
            unstoppable: ['abrams', 'apollo', 'billy', 'celeste', 'drifter', 'dynamo', 'graves', 'grey_talon', 'haze', 'holiday', 'infernus', 'ivy', 'lady_geist', 'lash', 'mina', 'mirage', 'mo_and_krill', 'paige', 'paradox', 'rem', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'vindicta', 'vyper', 'warden', 'wraith'],
            counterspell: ['abrams', 'apollo', 'calico', 'bebop', 'billy', 'grey_talon', 'infernus', 'ivy', 'lady_geist', 'lash', 'mo_and_krill', 'paige', 'paradox', 'rem', 'seven', 'sinclair', 'the_doorman', 'venator', 'victor', 'warden'],
            ethereal_shift: ['apollo', 'kelvin', 'lash', 'abrams', 'bebop', 'billy', 'calico', 'celeste', 'graves', 'grey_talon', 'haze', 'holiday', 'infernus', 'ivy', 'lady_geist', 'mcginnis', 'mina', 'mirage', 'mo_and_krill', 'paige', 'paradox', 'pocket', 'rem', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'warden', 'wraith', 'yamato'],

            // ANTI FIGHT HEROES
            rebuttal: PUNCHINGH_HEROES,


            // ANTI SPIRIT 
            // 2
            spirit_shielding: ['А это точно хорошая шмотка?'],
            // 3
            silence_wave: ['abrams', 'wraith', 'haze', 'ivy', 'rem', 'victor', 'apollo', 'billy', 'celeste', 'calico', 'dynamo', 'drifter', 'holiday', 'mina', 'mirage', 'infernus', 'pocket', 'lady_geist', 'lash', 'sinclair', 'the_doorman', 'shiv', 'viscous', 'yamato'],
            spirit_resilience: SPIRIT_HEROES,
            // 4
            spellbreaker: ['apollo', 'bebop', 'kelvin', 'calico', 'celeste', 'dynamo', 'holiday', 'lady_geist', 'lash', 'mina', 'mirage', 'paradox', 'shiv', 'sinclair', 'victor', 'viscous', 'yamato', 'wraith', 'paige'],
            silencer: SPIRIT_HEROES,
            scourge: ['А это точно контр шмотка?'],

            // ANTI EFFECTS HEROES
            dispel_magic: ['bebop', 'vindicta', 'graves', 'haze', 'infernus', 'mirage', 'mo_and_krill', 'drifter', 'lady_geist', 'mina', 'paradox', 'seven', 'warden', 'the_doorman', 'shiv', 'vyper'],

            // ANTI MOVEMENT HEROES 
            // 2
            // mystick_slow: [],
            slowing_hex: AGILE_HEROES,
            // 4
            capacitor: AGILE_HEROES,
            vortex_web: AGILE_HEROES,

            // ANTI GUN HEROES
            // 1
            rusted_barrel: GUN_HEROES,
            // 2
            return_fire: GUN_HEROES,
            suppressor: GUN_HEROES,
            // 3
            bullet_resilience: GUN_HEROES,
            metal_skin: ['haze', 'wraith', 'vyper', 'silver', 'venator'],
            disarming_hex: GUN_HEROES,
            // escalating: ['haze', 'wraith', 'venator', 'victor', 'silver', 'holiday', 'grey_talon', 'vyper'],
            // 4
            phantom_strike: GUN_HEROES,
            plated_armor: ['haze', 'infernus', 'mirage', 'mina', 'vyper'],
            juggernaut: GUN_HEROES,

            // RUN AWAY
            superior_stamina: [],
        };

        // Инверсия: предмет → герои  ==>  герой → предметы
        function toHeroList(itemToHeroes) {
            const heroToItems = {};

            for (const [itemId, heroIds] of Object.entries(itemToHeroes)) {
                for (const heroId of heroIds) {
                    (heroToItems[heroId] ??= []).push(itemId);
                }
            }

            return Object.entries(HEROES).map(([heroId, name]) => ({
                id: heroId,
                name,
                items: (heroToItems[heroId] ?? []).map(itemId => ITEMS[itemId] ?? itemId),
            }));
        }

        function dangerousSelected(selectedHeroIds, dangerous) {
            const selected = new Set(selectedHeroIds);
            return dangerous.filter(id => selected.has(id));
        }

        // selectedHeroIds — Set или массив id выбранных героев
        function buildResults(selectedHeroIds, itemToHeroes) {
            const selected = new Set(selectedHeroIds);

            return Object.entries(itemToHeroes)
                .map(([itemId, heroIds]) => {
                    const matched = heroIds.filter(id => selected.has(id));
                    const item = ITEMS[itemId] ?? { name: itemId, icon: '', tier: 0, categories: [] };
                    return {
                        id: itemId,
                        name: item.name ?? itemId,
                        icon: item.icon,
                        tier: item.tier,
                        categories: item.categories ?? [],
                        heroes: matched,               // массив id выбранных героев
                        heroNames: matched
                            .map(id => HEROES[id] ?? id)
                            .sort((a, b) => a.localeCompare(b)),
                        count: matched.length,         // сколько выбранных контрит
                    };
                })
                .filter(r => r.count > 0)          // оставляем только релевантные
                .sort((a, b) => b.count - a.count); // больше контрит — выше
        }

        function groupbByTier(results) {
            const groups = { 1: [], 2: [], 3: [], 4: [] };

            for (const r of results) {
                if (groups[r.tier]) groups[r.tier].push(r);
            }

            return groups;
        }


        const heroes = toHeroList(ITEM_TO_HEROES);

        const resetBtn = document.getElementById('reset');


        // === 2. Состояние ===
        const activeHeroes = new Set();   // id активных карточек
        let itemsPool = [];               // массив предметов всех активных героев (с повторами)

        // HERO COUNTING
        function countSelected(selectedHeroIds, heroList) {
            const selected = new Set(selectedHeroIds);
            console.log(selected);
            return heroList.filter(id => selected.has(id)).length;
        }


        function renderHeroCount() {
            const spiritCount = countSelected(activeHeroes, SPIRIT_HEROES); // 1
            const gunCount = countSelected(activeHeroes, GUN_HEROES);    // 2
            const container = document.querySelector('#counts');
            container.innerHTML = `
            <div class="hero-counting">
    <span class="counts__spirit">Спирит герои: ${spiritCount}</span>
    <span class="counts__gun">Ган герои: ${gunCount}</span>
  </div>
    `;

        }

        // === 3. Рендер карточек ===
        const grid = document.getElementById('grid');
        heroes.forEach(h => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = h.id;
            // ВАЖНО ДЛЯ ДЕБАГА И ПРОСМОТРА
            // card.innerHTML = `
            //   <div class="name">${h.name}</div>
            //   <div class="items">${h.items.join(', ')}</div>
            // `;
            card.innerHTML = `
              <div class="name">${h.name}</div>
            `;
            card.addEventListener('click', () => toggleHero(h.id));
            grid.appendChild(card);
        });

        // Сброс
        resetBtn.addEventListener('click', () => {
            activeHeroes.clear();
            updateUI();
            // container
            //     .querySelectorAll('input[type="checkbox"]')
            //     .forEach(cb => { cb.checked = false; });

            // // Если есть доп. логика (подсветка, фильтрация) — вызовите её
            // applyFilters();
        });

        // === 4. Переключение карточки ===
        function toggleHero(id) {
            if (activeHeroes.has(id)) {
                activeHeroes.delete(id);
            } else {
                activeHeroes.add(id);
            }
            updateUI();
        }

        // === 5. Полная пересборка пула предметов ===
        function rebuildPool() {
            itemsPool = [];
            activeHeroes.forEach(id => {
                const hero = heroes.find(h => h.id === id);
                if (hero) itemsPool.push(...hero.items); // добавляем все предметы героя
            });
        }

        // === 6. Подсчёт повторов и сортировка ===
        function getSortedCounts() {
            const counter = {}; // { itemName: count }
            for (const item of itemsPool) {
                counter[item] = (counter[item] || 0) + 1;
            }
            // Превращаем в массив объектов [{item, count}, ...]
            return Object.entries(counter)
                .map(([item, count]) => ({ item, count }))
                .sort((a, b) => b.count - a.count); // от большего к меньшему
        }

        // === 7. Обновление интерфейса ===
        function updateUI() {

            const selected = [...activeHeroes];
            renderDangerousHeroes(selected);
            renderCategoryFilter();
            renderHeroCount();
            const results = buildResults(selected, ITEM_TO_HEROES);

            const visible = results.filter(r => !blacklist.has(r.id));
            const groups = groupbByTier(visible);


            // подсветка карточек
            document.querySelectorAll('.card').forEach(card => {
                card.classList.toggle('active', activeHeroes.has(card.dataset.id));
            });

            rebuildPool();
            const sorted = getSortedCounts();

            const resultEl = document.getElementById('result');
            if (visible.length === 0) {
                resultEl.textContent = 'Выбери хотя бы одного героя';
                return;
            };

            resultEl.innerHTML = Object.entries(groups)
                .filter(([, items]) => items.length)     // пропускаем пустые тиры
                .sort(([a], [b]) => a - b)               // от 1 до 4
                .map(([tier, items]) => `
      <section class="tier-group">
        <h2 class="tier-group__title">Tier ${tier}</h2>
        <div class="tier-group__items">
          ${items
                        .sort((a, b) => b.count - a.count)   // внутри тира — по count
                        .map(r => `
              <div class="result-row" data-item-id="${r.id}">
                <div class="result__count count-${Math.min(r.count, 6)}">${r.count}</div>
                <img class="result__icon" src="${r.icon}" alt="">
                <div class="result__item">${r.name}</div>
                <div class="result__heroes">${r.heroNames.join(', ')}</div>
                <div id="result__hide" class="result__hide">Скрыть</div>
              </div>
            `).join('')}
        </div>
      </section>
    `).join('');

            renderBlacklist();

            //             resultEl.innerHTML = results.map(r => `
            //     <div class="result-row">
            //         <div class="result__count count-${Math.min(r.count, 6)}">${r.count}</div>
            //         <img class="result__icon" src="${r.icon}" alt=" " />
            //         <div class="result__item">${r.name}</div>
            //         <div class="result__heroes">${r.heroNames.join(', ')}</div>
            //     </div>
            //   `).join('');




        }

        // BLACKLIST
        // const blacklist = new Set(); // хранит id предметов
        const blacklist = new Set(
            JSON.parse(localStorage.getItem('blacklist') ?? '[]')
        );
        function saveBlacklist() {
            localStorage.setItem('blacklist', JSON.stringify([...blacklist]));
        }
        const resultsEl = document.querySelector('#result');

        resultsEl.addEventListener('click', (e) => {
            const counter = e.target.closest('.result__hide');
            if (!counter) return;

            const row = counter.closest('.result-row');
            const itemId = row?.dataset.itemId;
            if (!itemId) return;

            blacklist.add(itemId);
            saveBlacklist();
            updateUI(); // перерисовать и список, и чёрный список
        });

        function renderBlacklist() {
            const container = document.querySelector('#blacklist');
            if (!container) return;

            if (!blacklist.size) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = `
    <h2>Скрытое</h2>
    <div class="blacklist__items">
      ${[...blacklist].map(id => {
                const item = ITEMS[id];
                const name = item?.name ?? id;
                const icon = item?.icon ?? '';
                return `
          <div class="blacklist__item">
            ${icon ? `<img class="blacklist__icon" src="${icon}" alt="">` : ''}
            <span class="blacklist__name">${name}</span>
          </div>
        `;
            }).join('')}
    </div>
    <button type="button" class="blacklist__clear btn btn--reset">Очистить список</button>
  `;
        };

        document.querySelector('#blacklist').addEventListener('click', (e) => {
            if (!e.target.closest('.blacklist__clear')) return;

            blacklist.clear();
            saveBlacklist();
            updateUI();
        });


        // 


        function renderDangerousHeroes(selectedHeroIds) {
            const container = document.querySelector('#dangerous_mid_boss');
            if (!container) return;

            const dangerous = dangerousSelected(selectedHeroIds, DANGEROUS_MID_BOSS_HEROES);

            if (!dangerous.length) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
            <h2>Украдут мид-босса </h2>
            <div class="result">
                <div class="dangerous-list">
                    ${dangerous
                    .map(id => `${HEROES[id]}`)
                    .join(', ')}
                </div>
            </div>
            `;
        }
    </script>
