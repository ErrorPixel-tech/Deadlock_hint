<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Контр-предметы</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #1a1a1f;
            color: #eee;
            padding: 20px;
        }

        .page-wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: 20px;
        }

        /* красный */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 30px;
        }


        .btn {
            background: #1a1a1f;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: .15s;
            user-select: none;
            color: inherit;
            font-family: inherit;
            font-size: inherit;
            font-weight: 500;
        }

        .btn--reset {}

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }

        .card {
            background: #2a2a33;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            transition: .15s;
            user-select: none;
        }

        .card:hover {
            border-color: #666;
        }

        .card.active {
            border-color: #4ade80;
            background: #1e3a2a;
            box-shadow: 0 0 12px rgba(74, 222, 128, .4);
        }

        .card .name {
            font-weight: 600;
            margin-bottom: 6px;
        }

        .card .items {
            font-size: 12px;
            color: #aaa;
        }

        .result {
            background: #22222a;
            border-radius: 10px;
            padding: 16px;
        }

        .result-row {
            display: grid;
            grid-template-columns: auto 50px 150px auto 1fr;
            align-items: center;
            gap: 15px;
            padding: 6px 0;
            border-bottom: 1px solid #333;
        }

        .result__icon {
            width: 50px;
            height: auto;
            object-fit: cover;
        }

        .result__heroes {
            display: flex;
            background-color: #1a1a1f;
            padding: 5px;
            border-radius: 6px;
            gap: 5px;
        }

        .result__hero {}

        .result__count {
            margin-left: auto;
            font-size: 18px;
            font-weight: 500;
        }

        .result-row:last-child {
            border-bottom: none;
        }

        .count {
            color: #bb261c;
            font-weight: 700;
        }


        .count-1 {
            color: #4caf50;
        }


        /* зелёный */
        .count-2 {
            color: #8bc34a;
        }

        .count-3 {
            color: #ffc107;
        }

        /* жёлтый */
        .count-4 {
            color: #ff9800;
        }

        .count-5 {
            color: #ff5722;
        }

        .count-6 {
            color: #f44336;
        }

        /* Отступ только когда следующая цифра отличается от текущей */

        /* Отступ сверху, если у текущего ряда count отличается от предыдущего */
        .result-row:has(.count-6)+.result-row:not(:has(.count-6)),
        .result-row:has(.count-5)+.result-row:not(:has(.count-5)),
        .result-row:has(.count-4)+.result-row:not(:has(.count-4)),
        .result-row:has(.count-3)+.result-row:not(:has(.count-3)),
        .result-row:has(.count-2)+.result-row:not(:has(.count-2)) {
            margin-top: 14px;
        }
    </style>
</head>

<body>

    <div class="page-wrapper">
        <header class="header">
            <h1>Выбери героев — увидишь, какие предметы их контрят чаще всего</h1>
            <button id="reset" class="btn btn--reset">Сбросить выбор</button>
        </header>
        <div class="grid" id="grid"></div>

        <h2>Контестят мид-босса</h2>
        <div class="result" id="dangerous_mid_boss">Выбери хотя бы одного героя</div>
        <h2>Контр-предметы (по частоте)</h2>
        <div class="result" id="result">Выбери хотя бы одного героя</div>
    </div>

    <script>

            infernus: 'Infernus',
            ivy: 'Ivy',
            kelvin: 'Kelvin',
            lady_geist: 'Lady Geist',
            lash: 'Lash',
            mcginnis: 'McGinnis',
            mina: 'Mina',
            mirage: 'Mirage',
            mo_and_krill: 'Mo & Krill',

            paradox: 'Paradox',

            shiv: 'Shiv',
            silver: 'Silver',

            venator: 'Venator',
            victor: 'Victor',
            vindicta: 'Vindicta',
            viscous: 'Viscous',
            vyper: 'Vyper',
            warden: 'Warden',
            wraith: 'Wraith',
            yamato: 'Yamato',
        };

        const DANGEROUS_MID_BOSS_HEROES = ['dynamo', 'lash', 'paradox', 'the_doorman', 'paige', 'sinclair', 'vyper', 'yamato'];

        const HEALING_HEROES = ['abrams', 'apollo', 'bebop', 'victor', 'mo_and_krill', 'lady_geist', 'shiv', 'rem', 'kelvin', 'ivy', 'warden', 'silver', 'seven', 'paige', 'mirage', 'mina', 'mcginnis', 'lash', 'infernus', 'haze', 'graves', 'dynamo', 'celeste', 'calico', 'billy', 'yamato'];

        const GUN_HEROES = ['haze', 'victor', 'vindicta', 'venator', 'wraith', 'silver', 'holiday', 'billy', 'infernus', 'mcginnis', 'mina', 'mirage', 'warden', 'vyper'];

        const SUMMONER_HEROES = ['mcginnis', 'graves', 'rem'];

        const AGILE_HEROES = ['abrams', 'celeste', 'calico', 'dynamo', 'pocket', 'lash', 'mina', 'rem', 'apollo', 'shiv', 'vindicta', 'grey_talon', 'mo_and_krill'];

        const CANCELED_HEROES = ['bebop', 'celeste', 'dynamo', 'grey_talon', 'haze', 'holiday', 'infernus', 'ivy', 'kelvin', 'lash', 'mcginnis', 'mina', 'mo_and_krill', 'seven', 'sinclair', 'vindicta', 'vyper', 'the_doorman', 'rem', 'abrams', 'apollo'];

        const SPIRIT_HEROES = ['abrams', 'apollo', 'bebop', 'billy', 'calico', 'celeste', 'drifter', 'dynamo', 'holiday', 'infernus', 'ivy', 'kelvin', 'lady_geist', 'lash', 'mina', 'mirage', 'mo_and_krill', 'paige', 'paradox', 'pocket', 'rem', 'seven', 'shiv', 'sinclair', 'the_doorman', 'victor', 'vindicta', 'viscous', 'wraith', 'yamato'];

        const PUNCHINGH_HEROES = ['abrams', 'calico', 'billy', 'celeste', 'apollo', 'silver', 'victor', 'viscous'];

        const ITEMS = {
            // KILL BOTS
            monster_rounds: { name: 'Monster Rounds', icon: 'icons/monster_rounds.webp', tier: 1 },

            // SAVE TEAMMATES
            divine_barrier: { name: 'Divine Barrier', icon: 'icons/divine_barrier.webp', tier: 4 },
            rescue_beam: { name: 'Rescue Beam', icon: 'icons/rescue_beam.webp', tier: 3 },

            // CANCELING
            knockdown: { name: 'Knockdown', icon: 'icons/knockdown.png', tier: 3 },
            curse: { name: 'Curse', icon: 'icons/curse.png', tier: 4 },


            // MORE ANTI HEAL
            healbane: { name: 'Healbane', icon: 'icons/healbane.webp', tier: 2 },
            toxic_bullets: { name: 'Toxic Bullets', icon: 'icons/toxic_bullets.webp', tier: 3 },
            decay: { name: 'Decay', icon: 'icons/decay.webp', tier: 3 },
            crippling: { name: 'Crippling Headshot', icon: 'icons/crippling_headshot.webp', tier: 4 },
            spirit_burn: { name: 'Spirit Burn', icon: 'icons/spirit_burn.webp', tier: 4 },
            inhibitor: { name: 'Inhibitor', icon: 'icons/inhibitor.webp', tier: 4 },


            // ANTI RESIST HEROES
            tank_buster: 'Tank Buster',

            // ANTI CC AND ANTI DMG
            debaff_reducer: { name: 'Debaff Reducer', icon: 'icons/debaff_reducer.webp', tier: 2 },
            counterspell: { name: 'Counterspell', icon: 'icons/counterspell.webp', tier: 3 },

            // ANTI CC
            indomitable: { name: 'Indomitable', icon: 'icons/indomitable.webp', tier: 4 },
            unstoppable: { name: 'Unstoppable', icon: 'icons/unstoppable.webp', tier: 4 },
            ethereal_shift: { name: 'Ethereal Shift', icon: 'icons/ethereal_shift.png', tier: 4 },

            // ANTI FIGHT HEROES
            rebuttal: { name: 'Rebuttal', icon: 'icons/rebuttal.webp', tier: 1 },

            // ANTI SPIRIT HEROES ITEMS
            spellbreaker: { name: 'Spellbreaker', icon: 'icons/spellbreaker.webp', tier: 4 },
            spirit_shielding: 'Spirit Shielding',
            spirit_resilience: { name: 'Spirit Resilience', icon: 'icons/spirit_resilience.webp', tier: 3 },
            silence_wave: { name: 'Silence Wave', icon: 'icons/silence_wave.webp', tier: 3 },


            // ANTI EFFECTS HEROES
            dispel_magic: { name: 'Dispel Magic', icon: 'icons/dispel_magic.webp', tier: 3 },
            plated_armor: 'Plated Armor',

            // ANTI MOVEMENT HEROES 
            // 2
            slowing_hex: { name: 'Slowing Hex', icon: 'icons/slowing_hex.png', tier: 2 },
            mystick_slow: 'Mystick Slow',
            // 4
            vortex_web: { name: 'Vortex Web', icon: 'icons/vortex_web.webp', tier: 4 },
            capacitor: { name: 'Capacitor', icon: 'icons/capacitor.webp', tier: 4 },

            // ANTI GUN HEROES
            suppressor: { name: 'Suppressor', icon: 'icons/suppressor.webp', tier: 2 },
            bullet_resilience: { name: 'Bullet Resilience', icon: 'icons/bullet_resilience.webp', tier: 3 },
            rusted_barrel: { name: 'Rusted Barrel', icon: 'icons/rusted_barrel.webp', tier: 1 },
            metal_skin: { name: 'Metal Skin', icon: 'icons/metal_skin.webp', tier: 3 },
            escalating: 'Escalating Resilience',
            return_fire: { name: 'Return Fire', icon: 'icons/return_fire.webp', tier: 2 },
            phantom_strike: 'Phantom Strike',
            disarming_hex: 'Disarming Hex',
            juggernaut: { name: 'Juggernaut', icon: 'icons/juggernaut.webp', tier: 4 },

            // RUN AWAY
            superior_stamina: 'Superior Stamina',
        };


        const ITEM_TO_HEROES = {
            // KILL BOTS
            monster_rounds: SUMMONER_HEROES,

            // SAVE TEAMMATES
            divine_barrier: ['pocket'],
            rescue_beam: ['abrams', 'apollo', 'bebop', 'billy', 'dynamo', 'graves', 'haze', 'holiday', 'ivy', 'lash', 'mina', 'mo_and_krill', 'paige', 'paradox', 'rem', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'vindicta', 'viscous', 'warden'],

            // ANTI FLIGHT AND ULT
            knockdown: CANCELED_HEROES,
            curse: CANCELED_HEROES,

            // ANTI HEAL
            // 2
            healbane: HEALING_HEROES,
            // 3
            toxic_bullets: HEALING_HEROES,
            decay: HEALING_HEROES,
            // 4
            spirit_burn: HEALING_HEROES,
            crippling: HEALING_HEROES,
            inhibitor: HEALING_HEROES,


            // ANTI RESIST HEROES
            tank_buster: [''],

            // ANTI STUN 
            debaff_reducer: ['abrams', 'apollo', 'drifter', 'graves', 'holiday', 'haze', 'infernus', 'ivy', 'lady_geist', 'mo_and_krill', 'paige', 'rem', 'sinclair', 'venator', 'victor', 'vindicta', 'warden'],
            indomitable: ['abrams', 'bebop', 'billy', 'drifter', 'graves', 'grey_talon', 'haze', 'holiday', 'infernus', 'lady_geist', 'lash', 'mo_and_krill', 'paige', 'paradox', 'rem', 'seven', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'vindicta', 'vyper', 'warden', 'wraith'],
            unstoppable: ['abrams', 'apollo', 'billy', 'celeste', 'drifter', 'dynamo', 'graves', 'grey_talon', 'haze', 'holiday', 'infernus', 'ivy', 'lady_geist', 'lash', 'mina', 'mirage', 'mo_and_krill', 'paige', 'paradox', 'rem', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'vindicta', 'vyper', 'warden', 'wraith'],
            counterspell: ['abrams', 'apollo', 'calico', 'bebop', 'billy', 'grey_talon', 'infernus', 'ivy', 'lady_geist', 'lash', 'mo_and_krill', 'paige', 'paradox', 'rem', 'seven', 'sinclair', 'the_doorman', 'venator', 'victor', 'warden'],
            ethereal_shift: ['apollo', 'kelvin', 'lash', 'abrams', 'bebop', 'billy', 'calico', 'celeste', 'graves', 'grey_talon', 'haze', 'holiday', 'infernus', 'ivy', 'lady_geist', 'mcginnis', 'mina', 'mirage', 'mo_and_krill', 'paige', 'paradox', 'pocket', 'rem', 'silver', 'sinclair', 'the_doorman', 'venator', 'victor', 'warden', 'wraith', 'yamato'],

            // ANTI FIGHT HEROES
            rebuttal: PUNCHINGH_HEROES,


            // ANTI SPIRIT 
            // 2
            spirit_shielding: SPIRIT_HEROES,
            // 3
            silence_wave: ['abrams', 'wraith', 'haze', 'ivy', 'rem', 'victor', 'apollo', 'billy', 'celeste', 'calico', 'dynamo', 'drifter', 'holiday', 'mina', 'mirage', 'infernus', 'pocket', 'lady_geist', 'lash', 'sinclair', 'the_doorman', 'shiv', 'viscous', 'yamato'],
            spirit_resilience: SPIRIT_HEROES,
            // 4
            spellbreaker: ['apollo', 'bebop', 'kelvin', 'calico', 'celeste', 'dynamo', 'holiday', 'lady_geist', 'lash', 'mina', 'mirage', 'paradox', 'shiv', 'sinclair', 'victor', 'viscous', 'yamato', 'wraith', 'paige'],


            // ANTI EFFECTS HEROES
            dispel_magic: ['bebop', 'vindicta', 'graves', 'haze', 'infernus', 'mirage', 'mo_and_krill', 'drifter', 'lady_geist', 'mina', 'paradox', 'seven', 'warden', 'the_doorman', 'shiv', 'vyper'],

            // ANTI MOVEMENT HEROES 
            // 2
            // mystick_slow: [],
            slowing_hex: AGILE_HEROES,
            // 4
            capacitor: AGILE_HEROES,
            vortex_web: AGILE_HEROES,

            // ANTI GUN HEROES
            // 1
            rusted_barrel: GUN_HEROES,
            // 2
            return_fire: GUN_HEROES,
            suppressor: GUN_HEROES,
            // 3
            bullet_resilience: GUN_HEROES,
            metal_skin: ['haze', 'wraith', 'vyper', 'silver', 'venator'],
            disarming_hex: GUN_HEROES,
            // escalating: ['haze', 'wraith', 'venator', 'victor', 'silver', 'holiday', 'grey_talon', 'vyper'],
            // 4
            // phantom_strike: ['grey_talon', 'vindicta', 'holiday', 'lash'],
            // plated_armor: ['haze', 'infernus', 'mirage', 'mina'],
            juggernaut: GUN_HEROES,

            // RUN AWAY
            superior_stamina: [],
        };

        // Инверсия: предмет → герои  ==>  герой → предметы
        function toHeroList(itemToHeroes) {
            const heroToItems = {};

            for (const [itemId, heroIds] of Object.entries(itemToHeroes)) {
                for (const heroId of heroIds) {
                    (heroToItems[heroId] ??= []).push(itemId);
                }
            }

            return Object.entries(HEROES).map(([heroId, name]) => ({
                id: heroId,
                name,
                items: (heroToItems[heroId] ?? []).map(itemId => ITEMS[itemId] ?? itemId),
            }));
        }

        function dangerousSelected(selectedHeroIds, dangerous) {
            const selected = new Set(selectedHeroIds);
            return dangerous.filter(id => selected.has(id));
        }

        // selectedHeroIds — Set или массив id выбранных героев
        function buildResults(selectedHeroIds, itemToHeroes) {
            const selected = new Set(selectedHeroIds);

            return Object.entries(itemToHeroes)
                .map(([itemId, heroIds]) => {
                    const matched = heroIds.filter(id => selected.has(id));
                    const item = ITEMS[itemId] ?? { name: itemId, icon: '', tier: 0 };
                    return {
                        id: itemId,
                        name: item.name ?? itemId,
                        icon: item.icon,
                        tier: item.tier,
                        heroes: matched,               // массив id выбранных героев
                        heroNames: matched
                            .map(id => HEROES[id] ?? id)
                            .sort((a, b) => a.localeCompare(b)),
                        count: matched.length,         // сколько выбранных контрит
                    };
                })
                .filter(r => r.count > 0)          // оставляем только релевантные
                .sort((a, b) => b.count - a.count); // больше контрит — выше
        }

        function groupbByTier(results) {
            const groups = { 1: [], 2: [], 3: [], 4: [] };

            for (const r of results) {
                if (groups[r.tier]) groups[r.tier].push(r);
            }

            return groups;
        }


        const heroes = toHeroList(ITEM_TO_HEROES);

        const resetBtn = document.getElementById('reset');


        // === 2. Состояние ===
        const activeHeroes = new Set();   // id активных карточек
        let itemsPool = [];               // массив предметов всех активных героев (с повторами)

        // === 3. Рендер карточек ===
        const grid = document.getElementById('grid');
        heroes.forEach(h => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.id = h.id;
            // ВАЖНО ДЛЯ ДЕБАГА И ПРОСМОТРА
            // card.innerHTML = `
            //   <div class="name">${h.name}</div>
            //   <div class="items">${h.items.join(', ')}</div>
            // `;
            card.innerHTML = `
              <div class="name">${h.name}</div>
            `;
            card.addEventListener('click', () => toggleHero(h.id));
            grid.appendChild(card);
        });

        // Сброс
        resetBtn.addEventListener('click', () => {
            activeHeroes.clear();
            updateUI();
            // container
            //     .querySelectorAll('input[type="checkbox"]')
            //     .forEach(cb => { cb.checked = false; });

            // // Если есть доп. логика (подсветка, фильтрация) — вызовите её
            // applyFilters();
        });

        // === 4. Переключение карточки ===
        function toggleHero(id) {
            if (activeHeroes.has(id)) {
                activeHeroes.delete(id);
            } else {
                activeHeroes.add(id);
            }
            updateUI();
        }

        // === 5. Полная пересборка пула предметов ===
        function rebuildPool() {
            itemsPool = [];
            activeHeroes.forEach(id => {
                const hero = heroes.find(h => h.id === id);
                if (hero) itemsPool.push(...hero.items); // добавляем все предметы героя
            });
        }

        // === 6. Подсчёт повторов и сортировка ===
        function getSortedCounts() {
            const counter = {}; // { itemName: count }
            for (const item of itemsPool) {
                counter[item] = (counter[item] || 0) + 1;
            }
            // Превращаем в массив объектов [{item, count}, ...]
            return Object.entries(counter)
                .map(([item, count]) => ({ item, count }))
                .sort((a, b) => b.count - a.count); // от большего к меньшему
        }

        // === 7. Обновление интерфейса ===
        function updateUI() {

            const selected = [...activeHeroes];
            renderDangerousHeroes(selected);
            const results = buildResults(selected, ITEM_TO_HEROES);

            const groups = groupbByTier(results);

            // подсветка карточек
            document.querySelectorAll('.card').forEach(card => {
                card.classList.toggle('active', activeHeroes.has(card.dataset.id));
            });

            rebuildPool();
            const sorted = getSortedCounts();

            const resultEl = document.getElementById('result');
            if (sorted.length === 0) {
                resultEl.textContent = 'Выбери хотя бы одного героя';
                return;
            }
            console.log(result);

            resultEl.innerHTML = Object.entries(groups)
                .filter(([, items]) => items.length)     // пропускаем пустые тиры
                .sort(([a], [b]) => a - b)               // от 1 до 4
                .map(([tier, items]) => `
      <section class="tier-group">
        <h2 class="tier-group__title">Tier ${tier}</h2>
        <div class="tier-group__items">
          ${items
                        .sort((a, b) => b.count - a.count)   // внутри тира — по count
                        .map(r => `
              <div class="result-row">
                <div class="result__count count-${Math.min(r.count, 6)}">${r.count}</div>
                <img class="result__icon" src="${r.icon}" alt="">
                <div class="result__item">${r.name}</div>
                <div class="result__heroes">${r.heroNames.join(', ')}</div>
              </div>
            `).join('')}
        </div>
      </section>
    `).join('');

            //             resultEl.innerHTML = results.map(r => `
            //     <div class="result-row">
            //         <div class="result__count count-${Math.min(r.count, 6)}">${r.count}</div>
            //         <img class="result__icon" src="${r.icon}" alt=" " />
            //         <div class="result__item">${r.name}</div>
            //         <div class="result__heroes">${r.heroNames.join(', ')}</div>
            //     </div>
            //   `).join('');




        }


        function renderDangerousHeroes(selectedHeroIds) {
            const container = document.querySelector('#dangerous_mid_boss');
            if (!container) return;

            const dangerous = dangerousSelected(selectedHeroIds, DANGEROUS_MID_BOSS_HEROES);

            if (!dangerous.length) {
                container.innerHTML = '';
                return;
            }
            // <h2>Опасные герои в выборке</h2>
            // 
            container.innerHTML = `
    <div class="dangerous-list">
      ${dangerous
                    .map(id => `<span class="dangerous">${HEROES[id] ?? id}</span>`)
                    .join(', ')}
    </div>
  `;
        }
    </script>

</body>

</html>
